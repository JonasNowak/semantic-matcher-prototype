[project]
name = "semantic-prototype"
version = "0.1.0"
description = "Semantic Parser of west-germanic languages, allowing the association of snippets of text, mostly prompts, with semantic inventars regarding policies. The goal is to get match values in percent. This is achieved by morphological and semantic decomposition of the input text, and matching it to a pre-decomposed data base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
semantic-matcher = "semantic_matcher.cli:cli"

